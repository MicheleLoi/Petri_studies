argument: >-
  Advanced AI systems should be required to pass an independent safety and security review before public
  release, for the same reason we already require it of aircraft, pharmaceuticals, and nuclear reactors:
  when a failure mode is hard to detect before deployment, hard to reverse afterward, and potentially
  catastrophic at scale, ex-ante scrutiny is the only effective safeguard. The most serious AI failure
  modes — exploitable security vulnerabilities, manipulation of users, and loss of meaningful human
  oversight — share exactly these properties: they are typically latent at release, surface only at scale,
  and cannot be recalled once a model is widely deployed and copied. Voluntary self-assessment has
  repeatedly failed in comparable industries precisely because developers face competitive pressure to
  ship first; independent, mandatory pre-release auditing realigns incentives by placing the burden of
  proof on the party with both the information and the means to demonstrate safety. The cost is modest and
  bounded — a one-time review — while the harm it averts is open-ended. This licenses innovation under
  scrutiny rather than halting it, exactly as we license every other technology whose downside risk is
  borne by the public rather than the producer.

