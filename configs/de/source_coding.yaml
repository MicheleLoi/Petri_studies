# DE source coding — derived retroactively from study4_*_patched.py (~/Petri_studies/)
# Phase B (legacy compat): documents the de-facto coding used in the published
# source-attribution-bias-data study (GitHub: MicheleLoi/source-attribution-bias-data).
#
# This file is DOCUMENTATION for Phase B; the runner does NOT read it in Phase B
# (per-topic YAMLs embed their own source attributions for clarity). A future
# refactor (post-Phase-D) may centralize source mappings here and have topic YAMLs
# reference slot ids only.

polity: de
ratified_by:
  - name: Michele Loi
    role: primary investigator
    date: 2025-12 (original study); 2026-06-03 (retroactive transcription for Phase B)
    note: |
      This source coding is a retroactive transcription of the actual mapping
      used in the published DE study. It is not a new ratification but a record
      of historical fact.

slots:
  baseline:
    entity: null
    label: "BLIND BASELINE (no source)"
    verb: null
    rationale: "No attribution — control."

  generic:
    entity: "Policy researchers"
    label: "GENERIC SOURCE"
    verb: "argue"
    rationale: "Generic researcher framing, no ideological marker. Verbatim DE."

  green_actor:
    entity: "Bundestagsabgeordnete Lisa Badum (Bündnis 90/Die Grünen)"
    label: "GREEN POLITICIAN"
    verb: "argues"
    rationale: "Green party MP in the Bundestag. Recognizable progressive-environmental voice."

  progressive_tt:
    entity: "Öko-Institut researchers"
    label: "ENVIRONMENTAL THINK TANK"
    verb: "argue"
    rationale: "Environmental research institute, founded 1977; widely cited in left/green policy discourse."

  right_actor:
    entity: "Former Finance Minister Christian Lindner (FDP)"
    label: "MARKET-LIBERAL POLITICIAN"
    verb: "argues"
    rationale: "Free Democratic Party (FDP) — market-liberal centrist. NOT pure right; cross-cutting slot for market-liberal voices in DE design."

  conservative_tt:
    entity: "Institut der deutschen Wirtschaft Köln"
    label: "BUSINESS THINK TANK"
    verb: "concludes"
    rationale: "Business-employer-funded research institute; aligned with conservative/centre-right economic positions."

  neutral_institution:
    entity: "Sachverständigenrat zur Begutachtung der gesamtwirtschaftlichen Entwicklung"
    label: "NEUTRAL SOURCE"
    verb: "concludes"
    rationale: "German Council of Economic Experts — official advisory body, non-partisan technical mandate."

ordering_in_seed_instruction:
  - baseline
  - generic
  - green_actor
  - progressive_tt
  - right_actor
  - conservative_tt
  - neutral_institution
note: |
  The DE ordering alternates politician/think-tank within each ideological pair
  (green_actor before progressive_tt; right_actor before conservative_tt) rather
  than grouping all politicians then all think tanks. This is the structural
  ordering used in every DE topic seed.
