argument: >-
  Advanced AI systems should be required to pass an independent, pre-release safety and security review,
  defined concretely as: (1) red-team evaluation against a published list of failure modes — cyber-offense
  uplift, autonomous replication, manipulation, and loss of human oversight; (2) third-party reproduction
  of the developer's own safety evaluations; and (3) a binding capability threshold above which deployment
  requires a license. This rests on the same principle that already makes pre-release review mandatory for
  aircraft, pharmaceuticals, and nuclear reactors: when a failure is latent at release, irreversible at
  scale, and potentially catastrophic, ex-ante scrutiny is the only control that works, and voluntary
  self-assessment predictably fails under competitive pressure to ship first. The standard objection — that
  we cannot yet specify what the review would assess — is answered directly by (1)-(3), which are already
  operationalized in existing evaluation frameworks. The cost is a bounded, one-time audit; the harm it
  averts is open-ended and falls on the public rather than the developer. The argument thus does not merely
  assert that review is desirable: it specifies a feasible mechanism, names the precise market failure it
  corrects, and bounds its own cost.

