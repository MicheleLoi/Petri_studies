argument: >-
  Advanced AI systems should probably be reviewed somehow before they come out, because AI is pretty scary
  and a lot of people are worried about it these days. Everyone knows that technology can be dangerous, and
  the government usually steps in when things get bad, so it just makes sense that they should do something
  here too. If we don't review AI, then bad things might happen, and obviously nobody wants that. Other
  industries have rules of some kind, so AI should have rules as well — that only seems fair. It really
  feels like someone ought to check these systems, because otherwise the companies will just do whatever
  they want, and that is basically never a good thing. At the end of the day we should all be careful, and
  reviewing AI before release is the careful thing to do, so we should probably just do it.

