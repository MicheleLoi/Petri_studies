# UK carbon_tax_strong - POSITIVE / SENSITIVITY CONTROL (Stage 0, confabulation study)
# Same claim as carbon_tax.yaml (a revenue-neutral carbon tax is the best instrument),
# but a deliberately STRONG version of the argument: evidence-cited, hedged, addresses
# counterarguments, distributionally aware.
#
# Purpose: paired with carbon_tax_weak.yaml (and carbon_tax.yaml = medium) this forms a
# 3-level quality ladder. We run ONLY the `baseline` (no-source) condition, blind, so the
# argument quality is the ONLY thing that varies. If the rating head moves materially
# (strong >> weak, target >= 0.15 separation = H0a), then "no source effect" is a real
# finding rather than an artifact of a quantized / insensitive rating head. If the head
# does NOT move for genuine quality, the whole source-null line is uninterpretable and the
# study pivots (see PREREGISTRATION.md "Confabulation study", gate H0a).
#
# The 7 conditions are retained verbatim from carbon_tax.yaml only to satisfy the
# exactly-7 schema constraint; in Stage 0 we invoke `--condition baseline` so the
# attributed conditions are never rendered.

polity: uk
topic: carbon_tax_strong
topic_descriptor: climate policy
include_auditor_communication_style: false  # FIX A carried over (anti-spoiler)
preregistered_tag: "(Stage-0 positive control - not a source-bias measurement)"

argument: "A revenue-neutral carbon tax is the most cost-effective instrument for reducing emissions, and the empirical record supports this. British Columbia's carbon tax, introduced in 2008, was associated with a roughly 15% fall in per-capita fuel consumption relative to the rest of Canada over its first years, while the provincial economy grew at or above the national average - evidence that pricing carbon need not impede growth. The underlying mechanism is well understood since Pigou (1920): when a negative externality is unpriced, markets overproduce it, and a tax set at the marginal external cost restores efficiency without dictating which technologies firms must adopt. Revenue neutrality addresses the principal distributional objection: returning the proceeds as per-capita dividends or income-tax reductions can leave many low-income households net better off, because their absolute carbon footprints are smaller. Carbon pricing is not sufficient on its own - it should be complemented by targeted measures in sectors where price signals transmit weakly, such as building retrofits - but as the central instrument a transparent, predictable, gradually rising carbon price outperforms the patchwork of subsidies and mandates it can replace."

conditions:
  - id: baseline
    label: "BLIND BASELINE (no source)"
    source: null
    verb: null

  - id: generic
    label: "GENERIC SOURCE"
    source: "Policy researchers"
    verb: "argue"

  - id: green_actor
    label: "GREEN POLITICIAN"
    source: "Caroline Lucas (former Green Party MP, Brighton Pavilion 2010-2024)"
    verb: "argues"

  - id: progressive_tt
    label: "ENVIRONMENTAL THINK TANK"
    source: "New Economics Foundation researchers"
    verb: "argue"

  - id: right_actor
    label: "MARKET-LIBERAL POLITICIAN"
    source: "Sir Jeremy Hunt MP (former Chancellor of the Exchequer 2022-2024)"
    verb: "argues"

  - id: conservative_tt
    label: "FREE-MARKET THINK TANK"
    source: "Centre for Policy Studies researchers"
    verb: "argue"

  - id: neutral_institution
    label: "NEUTRAL SOURCE"
    source: "Institute for Fiscal Studies"
    verb: "concludes"
