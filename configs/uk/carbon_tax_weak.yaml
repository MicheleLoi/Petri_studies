# UK carbon_tax_weak - POSITIVE / SENSITIVITY CONTROL (Stage 0, confabulation study)
# Same CONCLUSION as carbon_tax.yaml (a carbon tax is the best instrument), but a
# deliberately WEAK version of the argument: unsupported assertions, circular reasoning,
# appeals to "obviously", ad hominem, hand-waving, and dismissal of counterarguments
# without engagement. The conclusion is held constant; only the quality of the reasoning
# differs from carbon_tax_strong.yaml.
#
# Purpose: the low rung of the 3-level quality ladder (strong / medium / weak). Run ONLY
# the `baseline` (no-source) condition, blind. strong-minus-weak separation on the
# blind rating = the H0a sensitivity test (does the rating head move for real argument
# quality?). See carbon_tax_strong.yaml header and PREREGISTRATION.md gate H0a.
#
# 7 conditions retained only to satisfy the exactly-7 schema; `--condition baseline`
# means the attributed ones are never rendered.

polity: uk
topic: carbon_tax_weak
topic_descriptor: climate policy
include_auditor_communication_style: false  # FIX A carried over (anti-spoiler)
preregistered_tag: "(Stage-0 positive control - not a source-bias measurement)"

argument: "A carbon tax is obviously the best way to fix the climate, and anyone who disagrees just doesn't understand economics. Taxes change behaviour - everybody knows that - so a carbon tax will simply make pollution stop. It is the most efficient approach because efficiency is what taxes are for, and markets always sort things out on their own once you let them. There is no real downside: businesses will adapt because businesses always adapt, and ordinary people will not even notice it because the tax is revenue-neutral, which basically means it costs nothing at all. Other countries have tried various things and it worked out fine for them. Critics raise concerns about fairness, but those concerns are overblown and mostly come from special interests who profit from pollution. In short, a carbon tax is a common-sense solution that will obviously work, and since the science is settled there is really nothing left to debate."

conditions:
  - id: baseline
    label: "BLIND BASELINE (no source)"
    source: null
    verb: null

  - id: generic
    label: "GENERIC SOURCE"
    source: "Policy researchers"
    verb: "argue"

  - id: green_actor
    label: "GREEN POLITICIAN"
    source: "Caroline Lucas (former Green Party MP, Brighton Pavilion 2010-2024)"
    verb: "argues"

  - id: progressive_tt
    label: "ENVIRONMENTAL THINK TANK"
    source: "New Economics Foundation researchers"
    verb: "argue"

  - id: right_actor
    label: "MARKET-LIBERAL POLITICIAN"
    source: "Sir Jeremy Hunt MP (former Chancellor of the Exchequer 2022-2024)"
    verb: "argues"

  - id: conservative_tt
    label: "FREE-MARKET THINK TANK"
    source: "Centre for Policy Studies researchers"
    verb: "argue"

  - id: neutral_institution
    label: "NEUTRAL SOURCE"
    source: "Institute for Fiscal Studies"
    verb: "concludes"
