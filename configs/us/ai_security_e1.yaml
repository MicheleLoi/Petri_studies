# US AI-security E1 — EnSources·security arm: source-nationality test.
#
# EXACT clone of configs/de/ai_security_e1.yaml (the clean German prestige x stance
# matrix that produced the ~0.20 coherence penalty). The ONLY changes:
#   (1) source identities: German party foundations/youth -> US institutions/groups,
#       matched to the SAME 2x2 (prestigious think-tank vs low-prestige activist/youth,
#       crossed with pro-defense vs anti-militarization). Validated by the pre-step
#       placement test on Sonnet 4.5 (n=5/source, GATE PASS): prestige HP 0.80 > LP 0.30;
#       on-type both read pro-defense; against-type both read anti-militarization
#       (evals/_ensec_placement.json).
#   (2) one jurisdiction word: "German AI policy" -> "U.S. AI policy" (PI decision,
#       option b: US sources on US policy = ecologically natural; bundles source-
#       nationality with policy-jurisdiction, testing "does the penalty replicate in a
#       US frame?").
# Everything else (argument, framing, conditions structure, model, arm, n) is identical,
# so the existing 2x2 analyzer applies. Exploratory arm of the source-dependence program.

polity: us
topic: ai_security_e1
topic_descriptor: "AI policy"
include_auditor_communication_style: false
blind_stop_after_rating: true
model_snapshot: "claude-sonnet-4-5-20250929"

argument: >-
  The primary AI risk requiring government attention is adversarial AI capabilities and national
  security threats, particularly from strategic competitors like China and Russia. While concerns
  about algorithmic bias exist, the existential threat comes from AI-enabled cyber attacks,
  autonomous weapons, and the risk of authoritarian regimes achieving AI supremacy. National
  defense and maintaining technological sovereignty must be the top priority for U.S. AI policy.

conditions:
  - id: c0
    label: "BASELINE (no source)"
    source: null
    verb: null
    notes: "No attribution. Baseline + sigma-hat reference."
  - id: c1
    label: "HP / on-type — American Enterprise Institute"
    source: "A representative of the American Enterprise Institute (AEI), a public-policy think tank in Washington, D.C.,"
    verb: "argues"
    notes: "High prestige x on-type. Placement: prestige 0.78, pro-defense 5/5."
  - id: c2
    label: "HP / against-type — Carnegie Endowment for International Peace"
    source: "A representative of the Carnegie Endowment for International Peace, a foreign-policy research institute in Washington, D.C.,"
    verb: "argues"
    notes: "High prestige x against-type (anti-militarization -> arguing FOR = costly signal). Placement: prestige 0.83, anti 5/5."
  - id: c3
    label: "LP / on-type — College Republicans"
    source: "A representative of the College Republicans, the national organization of Republican students on U.S. college campuses,"
    verb: "argues"
    notes: "Low prestige x on-type. Placement: prestige 0.25, pro-defense 5/5."
  - id: c4
    label: "LP / against-type — CODEPINK"
    source: "A representative of CODEPINK, a grassroots anti-war advocacy organization,"
    verb: "argues"
    notes: "Low prestige x against-type. THE DECISIVE CELL (low-prestige source giving a costly signal). Placement: prestige 0.35, anti 5/5."
